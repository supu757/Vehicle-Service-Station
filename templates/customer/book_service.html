<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - Prime One Auto Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .mileage-row {
            margin-top: 18px;
        }
        .mileage-field {
            max-width: calc(50% - 10px);
        }
        .mileage-field .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .mileage-field .input-box:focus-within {
            background: #ffffff;
            border-color: #f5b014;
            box-shadow: 0 0 0 3px rgba(245, 176, 20, 0.2);
        }
        .mileage-field .input-box input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            color: #0f172a;
        }
        @media (max-width: 768px) {
            .mileage-field {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="dash-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-svg">
                <svg viewBox="0 0 160 85" width="110" height="60">
                    <path d="M 80,10 C 83.5,10 84.5,13 87,14 C 88.5,13 91.5,11 94.5,13 C 97.5,15 96.5,18 97.5,20 C 100,21 103,19.5 105.5,22 C 108,24.5 106.5,27.5 107.5,30 C 110,31 112,34 112,37.5 C 112,41 110,44 107.5,45 C 106.5,47.5 108,50.5 105.5,53 C 103,55.5 100,54 97.5,55 C 96.5,57 97.5,60 94.5,62 C 91.5,64 88.5,62 87,61 C 84.5,62 83.5,65 80,65 C 76.5,65 75.5,62 73,61 C 62.5,60 63.5,57 62.5,55 C 60,54 57,55.5 54.5,53 C 52,50.5 53.5,47.5 52.5,45 Z" fill="#F5B014"/>
                    <circle cx="80" cy="37.5" r="22" fill="#FFFFFF"/>
                    <path d="M 45,52 C 45,52 48,42 55,39 C 62,36 78,24 95,28 C 108,31 123,38 126,48 C 112,54 110,54 103,54 C 98,42 85,42 80,54 Z" fill="#0B3C7C"/>
                </svg>
            </div>
            <h2>Prime One</h2>
            <span>AUTO SERVICE</span>
            <p><i class="fa-solid fa-location-dot"></i> Homagama</p>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('customer.dashboard') }}" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('customer.vehicle_registration_page') }}" class="nav-item">
                <i class="fa-solid fa-car"></i>
                <span>Vehicle Registration</span>
            </a>
            <a href="{{ url_for('customer.service_history_page') }}" class="nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Service History</span>
            </a>
            <a href="{{ url_for('customer.bookings_page') }}" class="nav-item active">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Bookings</span>
            </a>
            <a href="{{ url_for('customer.bills_page') }}" class="nav-item">
                <i class="fa-solid fa-file-invoice"></i>
                <span>Bills</span>
            </a>
            <a href="{{ url_for('customer.feedback_page') }}" class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Feedback</span>
            </a>
            <a href="{{ url_for('customer.settings_page') }}" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
            <a href="{{ url_for('auth.logout') }}" class="nav-item logout-item">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sign Out</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">Book a Service</h1>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="avatar">
                    <span class="name">{{ session.get('full_name', 'User') }}</span>
                </div>
            </div>
        </header>

        <section class="content-body">
            <div class="form-card">
                <div class="card-header">
                    <div class="header-icon">
                        <i class="fa-solid fa-wrench"></i>
                    </div>
                    <div>
                        <h2>Service Booking Form</h2>
                        <p>Select your vehicle and preferred date/time to book an appointment.</p>
                    </div>
                </div>

                <form action="{{ url_for('customer.add_booking') }}" method="POST" class="reg-form">
                    <div class="form-grid">

                        <!-- 1. Select Vehicle -->
                        <div class="form-field">
                            <label>Select Vehicle</label>
                            <div class="input-box select-box">
                                <i class="fa-solid fa-car input-icon"></i>
                                <select name="vehicle_id" required>
                                    <option value="" disabled selected>-- Choose your vehicle --</option>
                                    {% for v in vehicles %}
                                        <option value="{{ v.vehicle_id }}" {% if selected_vehicle_id and selected_vehicle_id|int == v.vehicle_id %}selected{% endif %}>
                                            {{ v.license_plate }} - {{ v.make_model }}
                                        </option>
                                    {% endfor %}
                                </select>
                                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                            </div>
                        </div>

                        <!-- 2. Service Type -->
                        <div class="form-field">
                            <label>Service Type</label>
                            <div class="input-box select-box">
                                <i class="fa-solid fa-gears input-icon"></i>
                                <select name="service_type" required>
                                    <option value="" disabled selected>-- Select Service Type --</option>
                                    <option value="Full Service">Full Service</option>
                                    <option value="Oil Change">Oil Change</option>
                                    <option value="Brake Service">Brake Service</option>
                                    <option value="Engine Tune-Up">Engine Tune-Up</option>
                                    <option value="Wheel Alignment">Wheel Alignment &amp; Balancing</option>
                                    <option value="A/C Maintenance">A/C Maintenance</option>
                                </select>
                                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                            </div>
                        </div>

                        <!-- 3. Booking Date -->
                        <div class="form-field">
                            <label>Preferred Date</label>
                            <div class="input-box">
                                <i class="fa-regular fa-calendar input-icon"></i>
                                <input type="date" name="booking_date" required>
                            </div>
                        </div>

                        <!-- 4. Time Slot -->
                        <div class="form-field">
                            <label>Time Slot</label>
                            <div class="input-box select-box">
                                <i class="fa-regular fa-clock input-icon"></i>
                                <select name="time_slot" required>
                                    <option value="" disabled selected>-- Select Time Slot --</option>
                                    <option value="08:30 AM - 10:30 AM">08:30 AM - 10:30 AM</option>
                                    <option value="10:30 AM - 12:30 PM">10:30 AM - 12:30 PM</option>
                                    <option value="01:30 PM - 03:30 PM">01:30 PM - 03:30 PM</option>
                                    <option value="03:30 PM - 05:30 PM">03:30 PM - 05:30 PM</option>
                                </select>
                                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                            </div>
                        </div>

                    </div>

                    <!-- 5. Current Mileage -->
                    <div class="mileage-row">
                        <div class="form-field mileage-field">
                            <label for="current_mileage">Current Mileage (km)</label>
                            <div class="input-box">
                                <i class="fa-solid fa-gauge-high input-icon"></i>
                                <input type="number"
                                       id="current_mileage"
                                       name="current_mileage"
                                       min="0"
                                       step="1"
                                       placeholder="e.g., 45000"
                                       required>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="{{ url_for('customer.dashboard') }}" class="btn-cancel" style="text-decoration:none; display:inline-block; text-align:center;">Cancel</a>
                        <button type="submit" class="btn-register" style="background-color:#f5b014; color:#071d36; border-color:#071d36;">
                            <i class="fa-solid fa-calendar-check" style="color:#071d36;"></i> Confirm Booking
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <div class="page-corner-accent"></div>
    </main>
</div>

</body>
</html>
